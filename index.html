<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f5df;--card:#fffdf3;--ink:#1c3a24;--mute:#58705d;--line:#c9dcc0;--green:#2f9e55;--green-d:#1f7a3f;--yellow:#f5b800;--red:#d6453d;--okbg:#d9f3df;--badbg:#fbe0dd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13241a;--card:#1d3326;--ink:#eef6ee;--mute:#a3bba8;--line:#355240;--green:#46c276;--green-d:#2f9e55;--okbg:#1f4a30;--badbg:#4d2522}}
:root[data-theme="dark"]{--bg:#13241a;--card:#1d3326;--ink:#eef6ee;--mute:#a3bba8;--line:#355240;--green:#46c276;--green-d:#2f9e55;--okbg:#1f4a30;--badbg:#4d2522}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45;min-height:100vh}
main{max-width:600px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:700;font-size:1.05rem}
.score{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600}
.dots{display:flex;gap:8px;margin-bottom:14px}
.dots span{flex:1;height:10px;border-radius:6px;background:var(--line)}
.dots .done{background:var(--green)}.dots .miss{background:var(--red)}.dots .now{background:var(--yellow)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px}
.pic{width:100%;height:auto;border-radius:14px;display:block;margin-bottom:14px}
h1{font-size:2rem;margin:0 0 8px;line-height:1.15}
h2{font-size:1.25rem;margin:0 0 4px;line-height:1.3}
p{margin:0 0 12px}
.quote{font-size:1.15rem;font-weight:600;background:var(--bg);border-left:6px solid var(--yellow);padding:10px 14px;border-radius:10px;margin:8px 0 12px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;cursor:pointer}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--green)}
.opt.bad{background:var(--badbg);border-color:var(--red)}
.fo{grid-template-columns:1fr 1fr}.fo .opt{justify-content:center;font-size:1.2rem;font-weight:600}
.btn{font:inherit;font-weight:600;font-size:1.05rem;color:#fff;background:var(--green);border:0;border-bottom:5px solid var(--green-d);border-radius:16px;padding:12px 24px;cursor:pointer;margin-top:14px}
.btn:active{transform:translateY(2px);border-bottom-width:3px}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb strong{display:block;font-size:1.1rem}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.stars{font-size:2.6rem;letter-spacing:6px;margin:6px 0}
.big{font-size:3rem;font-weight:700;line-height:1}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.6}}}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand">Waste Detective Challenge</div><div class="score" id="score" hidden></div></div>
  <div class="dots" id="dots" hidden></div>
  <section class="card" id="view" aria-live="polite"></section>
</main>

{pic:1,prompt:"This waste is classified as ______ waste.",opts:["Organic","Inorganic","Hazardous"],ans:0,

{pic:2,prompt:"Why does this waste stay in the environment for a very long time?",
 opts:["Because inorganic waste does not decompose easily.","Because it is made from fruit peels and leaves.","Because trained workers collect it every day.","Because it can be turned into compost."],ans:0,
 why:"Plastic bottles, glass and cans are inorganic. A plastic bottle needs hundreds of years to break down."},
{pic:3,prompt:"Why must this waste be handled separately?",
 opts:["It contains toxic substances that can pollute soil and water and harm health.","It decomposes too quickly and attracts insects.","It can be turned into compost for plants.","It is made from glass and styrofoam."],ans:0,
 why:"Used batteries are hazardous waste. They contain toxic substances and must be handled by trained workers."},
{pic:4,prompt:"Which ONE sentence states the main idea of this picture?",
 opts:["Waste should be sorted into different bins according to its type.","Plastic is the most dangerous kind of waste for the sea.","Every household should make its own compost.","Used batteries are sold in many colors."],ans:0,
 why:"The three labeled bins show that organic, inorganic and hazardous waste need to be sorted by type."},
{pic:5,fo:true,prompt:"Is the following sentence a fact or an opinion?",quote:"\u201CRecycling is the best way to save the Earth.\u201D",opts:["Fact","Opinion"],ans:1,
 why:"It is an opinion. It shows a personal judgment, with the words \u201Cthe best\u201D."}

let i=0,score=0,streak=0,res=[],order=[];
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

function start(){i=0;score=0;streak=0;res=[];$('dots').hidden=true;$('score').hidden=true;
 $('view').innerHTML=`<h1>Can you sort the waste?</h1><p>Look at each picture and answer the question. There are 5 pictures. Get answers right in a row for bonus points.</p><button class="btn" id="go">Start the game</button>`;
 $('go').onclick=show}
function show(){const q=Q[i];dots();setScore();
 const o=q.fo?q.opts.map((t,k)=>({t,k})):shuffle(q.opts.map((t,k)=>({t,k})));order=o;
 $('view').innerHTML=`<img class="pic" src="${IMG[q.pic-1]}" alt="Picture ${q.pic}"><h2>Look at Picture ${q.pic}. ${q.prompt}</h2>${q.quote?`<div class="quote">${q.quote}</div>`:''}

 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n))}
function answer(n){const q=Q[i],right=order[n].k===q.ans;
 document.querySelectorAll('.opt').forEach((b,m)=>{b.disabled=true;if(order[m].k===q.ans)b.classList.add('ok');else if(m===n)b.classList.add('bad')});
 let pts=0;if(right){streak++;pts=100+(streak-1)*25;score+=pts}else streak=0;
 res.push(right);setScore();dots();
 const last=i===Q.length-1;
 $('after').innerHTML=`<div class="fb ${right?'ok':'bad'}"><strong>${right?'Correct! +'+pts+' pts':'Not quite.'}</strong>${q.why}</div><button class="btn" id="nx">${last?'See my result':'Next picture'}</button>`;
 $('nx').onclick=()=>{if(last)finish();else{i++;show()}};$('nx').focus()}
function finish(){const c=res.filter(Boolean).length,st=c===5?3:c>=4?2:c>=2?1:0;
 const msg=c===5?'Perfect! You are a real waste detective.':c>=3?'Great work! Review the ones you missed and try again.':'Good try! Read the text again and play once more.';
 $('dots').hidden=true;
 $('view').innerHTML=`<h1>${c} / 5 correct</h1><div class="stars" aria-label="${st} of 3 stars">${'\u2605'.repeat(st)}${'\u2606'.repeat(3-st)}</div><div class="big">${score} pts</div><p style="margin-top:12px">${msg}</p><button class="btn" id="again">Play again</button>`;
